# CRM — umumiy nginx sozlamalari (http darajasi). deploy/setup-server.sh
# /etc/nginx/conf.d/crm-common.conf ga o'rnatadi; nginx.conf conf.d/*.conf ni
# sites-enabled/* dan OLDIN ulaydi — `timed` formati sayt blokida ishlatiladi.
#
# 27.09.2026 (audit): javobda nginx versiyasi ko'rinmasin; jurnalda javob
# vaqti bo'lsin (rt — to'liq, urt — Next.js) — sekin so'rovlarni topish uchun.
# Birinchi qismi standart `combined` bilan bir xil — eski o'qish usullari ishlayveradi.
server_tokens off;
log_format timed '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time';
