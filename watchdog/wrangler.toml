# TIZIMLI24 QOROVULI — Cloudflare Worker sozlamasi (watchdog/worker.js izohi).
#
#   cd watchdog
#   npx wrangler login                         # bir marta (brauzerda «Allow»)
#   npx wrangler kv namespace create STATE     # chiqqan id ni pastdagi [[kv_namespaces]] ga
#   npx wrangler secret put TELEGRAM_BOT_TOKEN # @tizimli_akademiya_bot tokeni (o'zingiz kiritasiz)
#   npx wrangler deploy
name = "tizimli24-qorovul"
main = "worker.js"
compatibility_date = "2026-10-01"
# Ochiq workers.dev manzili YO'Q — faqat cron (12.10.2026). Holat:
#   npx wrangler kv key get state --binding STATE --remote
workers_dev = false

[vars]
FAILS_TO_ALERT = "2"
# @tizimli_akademiya_bot xabar yuboradigan Telegram foydalanuvchi(lar)i, vergul bilan.
# Har biri botda Start bosgan bo'lishi shart.
TELEGRAM_CHAT_IDS = "8133288542"

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "STATE"
id = "cfd9b07843cf4c7e8d0c9021a8fe7c86"
